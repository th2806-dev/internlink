services:
  # =========================================================================
  # 1. ASP.NET Core Backend API (.NET 10 - Host Port: 7109 -> Container: 8080)
  # =========================================================================
  backend:
    build:
      context: ./backend/InternLink
      dockerfile: Dockerfile
    container_name: internlink_api
    depends_on:
      database:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=database,1433;Database=InternLink;User Id=sa;Password=${MSSQL_SA_PASSWORD:-InternLink_Sa123!};TrustServerCertificate=True;MultipleActiveResultSets=true;IPAddressPreference=IPv4First
      - Jwt__Secret=${JWT_SECRET:-InternLink_SecretKey_Production_SuperSecure_32BytesLength!}
      - Jwt__Issuer=InternLink
      - Jwt__Audience=InternLinkClients
      - Email__Enabled=${EMAIL_ENABLED:-true}
      - Email__SmtpHost=smtp.gmail.com
      - Email__SmtpPort=587
      - Email__Username=${EMAIL_USERNAME:-internlink.cntt@gmail.com}
      - Email__Password=${EMAIL_PASSWORD:-}
      - Email__FromAddress=${EMAIL_USERNAME:-internlink.cntt@gmail.com}
      - Email__PortalUrl=${PORTAL_URL:-http://localhost:3000}
      - Cors__AllowedOrigins__0=${PORTAL_URL:-http://localhost:3000}
      - Cors__AllowedOrigins__1=http://localhost:5173
    # Không publish port ra ngoài - chỉ truy cập qua Nginx proxy (frontend:3000)
    # Muốn gỡ lỗi Swagger trực tiếp: uncomment dòng dưới
    # ports:
    #   - "127.0.0.1:7109:8080"
    volumes:
      - internlink_uploads_data:/app/uploads
    networks:
      - internlink_network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: unless-stopped

  # =========================================================================
  # 2. Microsoft SQL Server 2022 (Host Port: 1433 -> Container: 1433)
  # =========================================================================
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: internlink_database
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-InternLink_Sa123!}"
      MSSQL_PID: "Developer"
      # Giới hạn RAM SQL Server tránh OOM trên máy 4-8GB (mặc định chiếm 80% RAM vật lý)
      MSSQL_MEMORY_LIMIT_MB: "${MSSQL_MEMORY_LIMIT_MB:-2048}"
    # Không publish port ra ngoài - SQL Server chỉ truy cập nội bộ qua Docker network
    # ports:
    #   - "127.0.0.1:1433:1433"
    volumes:
      - internlink_database_data:/var/opt/mssql
    networks:
      - internlink_network
    healthcheck:
      test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -C -b -o /dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  # =========================================================================
  # 3. Frontend React SPA & Nginx Reverse Proxy (Host Port: 3000 -> Container: 80)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: internlink_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - internlink_network
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# ===========================================================================
# Volumes & Networks Definition
# ===========================================================================
volumes:
  internlink_uploads_data:
    driver: local
    name: internlink_uploads_data
  internlink_database_data:
    driver: local
    name: internlink_database_data

networks:
  internlink_network:
    driver: bridge
    name: internlink_network
